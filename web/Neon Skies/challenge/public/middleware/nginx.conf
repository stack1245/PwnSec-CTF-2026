worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile           on;
  keepalive_timeout  65;
  server_tokens      off;

  # Resolving service names at request time keeps nginx from refusing to boot
  # while an upstream is still coming up.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  log_format neon '$remote_addr "$request" $status $body_bytes_sent '
                  '$upstream_addr ${upstream_response_time}s';
  access_log /dev/stdout neon;
  error_log  /dev/stderr warn;

  server {
    listen 8000;
    server_name _;

    client_max_body_size 64k;

    location ~ ^/report(?:/.*)?$ {
      set $bot http://bot:3001;
      proxy_pass $bot;

      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection        "";

      proxy_connect_timeout 5s;
      proxy_send_timeout    30s;
      # Must outlast the bot's dwell on the reported page.
      proxy_read_timeout    180s;
      proxy_buffering       off;
    }

    location / {
      set $web http://neon_skies:3000;
      proxy_pass $web;

      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection        "";

      proxy_connect_timeout 5s;
      proxy_send_timeout    30s;
      proxy_read_timeout    60s;
    }
  }
}
