name: Secrets

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out public repository without initializing archived gitlinks
        shell: bash
        run: |
          set -euo pipefail
          # 과거 분석 자료의 gitlink에 .gitmodules가 없습니다.
          # 토큰을 저장하거나 서브모듈을 순회하지 않고 공개 Git 객체만 가져옵니다.
          git init -b main .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --prune origin \
            '+refs/heads/*:refs/remotes/origin/*' "$GITHUB_SHA"
          git sparse-checkout init --cone
          git sparse-checkout set scripts tests/security
          git checkout --detach "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          curl --fail --silent --show-error --location --retry 3 \
            --output gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - name: Create local Python environment
        run: python -m venv .venv
      - name: Regression tests
        run: .venv/bin/python -m unittest discover -s tests/security -v
      - name: Check tracked snapshot including binary files
        run: .venv/bin/python scripts/check-secrets.py
      - name: Check new commits for other secrets
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == pull_request ]]; then
            range="$PR_BASE_SHA..$PR_HEAD_SHA"
          elif [[ -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            range="$BEFORE_SHA..HEAD"
          elif [[ "$EVENT_NAME" == push ]]; then
            if base=$(git merge-base refs/remotes/origin/main HEAD); then
              range="$base..HEAD"
            else
              range='--all'
            fi
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            range='HEAD^..HEAD'
          else
            range='--all'
          fi
          # 추가 후 삭제된 바이너리 키도 모든 신규 커밋에서 차단합니다.
          git rev-list "$range" > "$RUNNER_TEMP/secret-check-commits"
          while IFS= read -r commit; do
            .venv/bin/python scripts/check-secrets.py --ref "$commit"
          done < "$RUNNER_TEMP/secret-check-commits"
          gitleaks git . --log-opts="$range" --redact=100 --no-banner --ignore-gitleaks-allow
