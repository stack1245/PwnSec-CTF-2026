title = "PwnSec CTF secret checks"
minVersion = "8.30.1"

[extend]
useDefault = true

[[allowlists]]
description = "CTF 배포 설정의 SHA-256 암호 해시; API 인증 키가 아닙니다."
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^web/Neon Skies/challenge/public/docker-compose\.yml$''']
regexTarget = "match"
regexes = ['''^ADMIN_PASSWORD_SHA256: "[0-9a-fA-F]{64}"$''']
